name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -Djava.awt.headless=true' -Djava.awt.headless=true"
        run: |
          # Locate the project directory
          BUILD_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            TARGET_DIR=$(dirname "$BUILD_FILE")
            echo "Entering project directory: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi

          # Configure headless mode and KSP2 in gradle.properties
          touch gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true" >> gradle.properties
          echo "ksp.useKSP2=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties

          gradle assembleDebug --stacktrace -Djava.awt.headless=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WayPoint-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
